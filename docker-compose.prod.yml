name: nookbox-prod

# =============================================================
# nookbox 운영 스택 (RP)
#
# IdP(idp 레포)와는 별도 compose 프로젝트다. 배포 주기를 분리하기 위함.
# 두 스택은 공유 네트워크 nook-edge 로만 만난다.
#
# ⚠️ 최초 1회, 두 스택 중 어느 쪽을 띄우든 그 전에 네트워크부터 만들어야 한다:
#
#     docker network create nook-edge
#
#   external: true 로 참조하므로 compose 가 대신 만들어주지 않는다.
#   대신 idp 를 먼저 띄우든 nookbox 를 먼저 띄우든 순서를 안 타게 된다.
#
# 실행:
#   docker network create nook-edge                      # 최초 1회
#   docker compose --env-file .env.prod -f docker-compose.prod.yml \
#     --profile migrate run --rm --build migrate         # 스키마 반영
#     ↑ --build 필수. 빼면 옛 이미지로 돌아 "No changes detected" 만 뜬다.
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# -------------------------------------------------------------
# ⚠️ better-auth 1.7 최초 배포에 한해, migrate 앞에 백필이 한 번 필요하다.
#
#   1.7 은 account.issuer 를 NOT NULL 로 요구한다. account 에 행이 있는 상태에서
#   push 가 이 컬럼을 만들면 기본값이 없어 ALTER 가 그냥 실패한다(프롬프트가
#   아니라 SQL 에러다). nullable 로 먼저 만들고 채운 뒤 push 를 돌린다.
#   값은 OIDC_ISSUER 와 정확히 같아야 한다 — auth.ts 의 accountIssuer 가
#   그 값이고, 백채널 로그아웃이 (issuer, account_id) 로 계정을 찾는다.
#
#     docker compose --env-file .env.prod -f docker-compose.prod.yml \
#       exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
#     ALTER TABLE account ADD COLUMN IF NOT EXISTS issuer text;
#     UPDATE account SET issuer = 'https://id.nook-box.com/api/auth'
#      WHERE issuer IS NULL;
#     SQL
#
#   그 다음 migrate 를 돌리면 NOT NULL 과 (issuer, account_id) 유니크 인덱스만
#   남아서 깨끗이 지나간다. 두 번째 배포부터는 이 단계가 필요 없다.
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # IdP 의 DB 와는 완전히 별개다. RP 는 자기 계정/세션만 저장한다.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 스키마 반영 — 일회성. 평소엔 뜨지 않는다(profiles).
  # ---------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['migrate']
    restart: 'no'

  # ---------------------------------------------------------
  # server — RP 백엔드 (NestJS)
  #
  # 브라우저가 직접 부르는 건 /api/auth/* 뿐이다(better-auth).
  # /users/* 같은 나머지 REST 는 web 의 서버 컴포넌트가 컨테이너 안에서만 부른다
  # (apps/web/src/lib/api/server.ts 는 'server-only').
  # 그래서 터널에도 /api/auth/* 만 뚫는다.
  # ---------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # ⚠️ IdP 와 같은 이유로 web 과 server 가 한 오리진(PUBLIC_ORIGIN)을 쓰고
      #    경로로 나눈다. RP 세션 쿠키가 그 한 호스트에 host-only 로 묶여야
      #    web 의 서버 컴포넌트(proxy.ts 의 getSessionCookie)가 세션을 읽는다.
      #    server 를 api.nook-box.com 으로 쪼개면 쿠키가 그쪽에만 저장되어
      #    web 이 못 읽는다. IdP 에서 이미 겪은 그 증상이다.
      #
      # ⚠️ 이 값이 IdP 에 등록할 redirect_uri 의 근거다:
      #    <BETTER_AUTH_URL>/api/auth/callback/<OIDC_PROVIDER_ID>
      #    (apps/server/src/lib/auth.ts 의 oauthCallbackUrl)
      #    ⚠️ better-auth 1.7 에서 /oauth2/callback/ → /callback/ 로 바뀌었다.
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN}
      WEB_URL: ${PUBLIC_ORIGIN}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      # IdP 주소. discovery 는 여기에 .well-known/openid-configuration 을 붙여 찾는다.
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-nook-auth}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    ports:
      # 외부 노출은 idp 스택의 cloudflared 가 담당한다.
      # 여기서는 127.0.0.1 에만 묶어 서버에서 curl 로 찔러보는 용도로만 남긴다.
      - '127.0.0.1:${SERVER_HOST_PORT:-8082}:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # default: web/postgres 와 통신. nook-edge: cloudflared 가 닿기 위함.
      default:
      nook-edge:
        # 공유 네트워크에서는 "server" 같은 흔한 이름이 다른 스택과 겹칠 수 있다.
        # cloudflared 대시보드에는 이 별칭을 적는다.
        aliases:
          - nookbox-server
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------
  # web — 랜딩 + 서비스 화면 (Next.js)
  # ---------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # ⚠️ 브라우저 번들에 문자열로 박히는 값이다. 컨테이너 환경변수로는 못 바꾼다.
        #    바꾸려면 반드시 --build 로 이미지를 다시 만들어야 한다.
        #    단일 오리진이므로 web 자신의 주소와 같다.
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN}
    restart: unless-stopped
    environment:
      # 서버 컴포넌트가 server 를 부를 내부 주소.
      # config.ts 가 BACKEND_URL 을 NEXT_PUBLIC_API_URL 보다 우선한다.
      # 이걸 안 주면 서버 컴포넌트가 공개 주소로 나갔다가 터널을 한 바퀴 돌아 들어온다.
      BACKEND_URL: http://server:4000
      # ⚠️ 라우트 핸들러가 callbackURL·Origin 헤더를 조립할 때 쓰는 공개 주소.
      #    컨테이너 안에서는 req.nextUrl.origin 이 https://0.0.0.0:3030 이라 못 쓴다.
      #    요청 헤더(x-forwarded-host)로 복원하면 클라이언트가 위조할 수 있어
      #    (cloudflared 는 이 헤더를 덮어쓰지 않는다) 여기서 못박아 넘긴다.
      #    NEXT_PUBLIC_API_URL 과 값은 같지만 그건 빌드 인자라 별개다.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    ports:
      # server 와 같은 이유로 로컬 전용.
      - '127.0.0.1:${WEB_HOST_PORT:-8083}:3030'
    depends_on:
      - server
    networks:
      default:
      nook-edge:
        aliases:
          - nookbox-web

volumes:
  postgres-data:

networks:
  # idp 스택의 cloudflared 와 공유하는 네트워크.
  # 두 프로젝트가 각자 external 로 참조하므로 기동 순서에 의존하지 않는다.
  nook-edge:
    external: true
